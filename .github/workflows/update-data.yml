name: Cap nhat so lieu tai chinh

on:
  schedule:
    - cron: "0 11 * * *"   # 18:00 giờ Việt Nam mỗi ngày
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Cai thu vien
        run: pip install -U vnstock pandas
      - name: Lay so lieu
        run: python scripts/update_data.py
      - name: Luu ket qua
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Cap nhat so lieu tai chinh"
          git push
