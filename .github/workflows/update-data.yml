name: Cap nhat so lieu tai chinh

on:
  schedule:
    - cron: "0 11 * * *"
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: "daily = hằng ngày | full = lấy lại toàn bộ | none = chỉ đăng trang"
        type: choice
        options: [daily, full, none]
        default: daily

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Khoi phuc so lieu lan truoc
        uses: actions/cache/restore@v4
        with:
          path: data
          key: data-${{ github.run_id }}
          restore-keys: data-
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Cai thu vien
        if: github.event_name != 'push'
        run: npm install --no-save --ignore-scripts vnstock-js
      - name: Lay so lieu
        if: github.event_name != 'push'
        run: node scripts/update_data.mjs --mode=${{ inputs.mode || 'daily' }}
      - name: Luu so lieu cho lan sau
        if: github.event_name != 'push'
        uses: actions/cache/save@v4
        with:
          path: data
          key: data-${{ github.run_id }}
      - name: Dong goi trang
        run: |
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '.github' --exclude 'node_modules' --exclude 'scripts' --exclude '_site' --exclude 'package*.json' ./ _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
