name: Cap nhat so lieu tai chinh

on:
  schedule:
    - cron: "0 11 * * *"
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: "daily = hằng ngày | full = lấy lại toàn bộ | none = chỉ đăng trang"
        type: choice
        options: [daily, full, none]
        default: daily

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Khoi phuc so lieu lan truoc
        uses: actions/cache/restore@v4
        with:
          path: data
          key: data-${{ github.run_id }}
          restore-keys: data-
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Cai thu vien
        if: github.event_name != 'push'
        run: npm install --no-save --ignore-scripts vnstock-js
      - name: Lay so lieu
        if: github.event_name != 'push'
        run: node scripts/update_data.mjs --mode=${{ inputs.mode || 'daily' }}
      - name: Luu so lieu cho lan sau
        if: github.event_name != 'push'
        uses: actions/cache/save@v4
        with:
          path: data
          key: data-${{ github.run_id }}
      - name: Kiem tra so lieu
        continue-on-error: true
        run: |
          node -e '
          const fs=require("fs");const J=f=>{try{return JSON.parse(fs.readFileSync(f,"utf8"))}catch{return null}};
          const d=J("data/debug.json")||{};const e=d.errors||{};
          console.log("debug keys:",Object.keys(d).join(","));
          console.log("deepErr:",d.deepErr,"| fptsIdx:",d.fptsIdx,"| pxCount:",d.pxCount,"| finCount:",d.finCount);
          for(const k of Object.keys(d).filter(k=>/_deep$/.test(k)))console.log(k,JSON.stringify(d[k]));
          const ev=Object.entries(e);console.log("so loi:",ev.length);const g={};for(const[,v] of ev){const t=String(v).slice(0,60);g[t]=(g[t]||0)+1}
          console.log(JSON.stringify(Object.entries(g).sort((a,b)=>b[1]-a[1]).slice(0,12),null,1));
          let n=0,deep=0,old=0;for(const f of fs.readdirSync("data/px")){const x=J("data/px/"+f);if(!x?.bars?.length)continue;n++;if(x.deep)deep++;if(x.bars[0][0]<"2021-01-01")old++}
          console.log("px:",n,"deep:",deep,"co du lieu truoc 2021:",old);
          for(const s of ["FPT","VNM","VCB","HPG","VNINDEX"]){const x=J("data/px/"+s+".json");console.log(s,x?.bars?.length,x?.bars?.[0]?.[0],x?.deep)}
          for(const s of ["FPT","VCB"]){const x=J("data/px/"+s+".json");console.log(s,"last",JSON.stringify(x?.bars?.at(-1)),"ratios",JSON.stringify({...(x?.ratios||{}),hist:undefined}),"fin",JSON.stringify(x?.fin).slice(0,400))}
          const sm=J("data/summary.json");console.log("groups:",JSON.stringify(Object.fromEntries(Object.entries(sm?.groups||{}).slice(0,40).map(([k,v])=>[k,{n:v.n,roe:v.roe&&+v.roe.toFixed(3),nm:v.nm&&+v.nm.toFixed(3)}]))));
          const rk=J("data/rank.json");console.log("rank groups:",rk?Object.keys(rk.groups).length:null,"Ngan hang:",JSON.stringify((rk?.groups?.["Ngân hàng"]||[]).slice(0,4)));
          console.log("nhanDinh",d.nhanDinh,d.nhanDinhErr||"",d.minutes,"phut");
          const ij=J("data/indices.json");console.log("indices dates:",ij?Object.keys(ij.hist||{}).length:null);
          '
      - name: Dong goi trang
        run: |
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '.github' --exclude 'node_modules' --exclude 'scripts' --exclude '_site' --exclude 'package*.json' ./ _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
